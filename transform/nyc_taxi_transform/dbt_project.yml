name: 'nyc_taxi_transform'
version: '2.0.0'
config-version: 2

profile: 'nyc_taxi_transform'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Set by Airflow for monthly incremental runs, e.g. --vars '{"month": "2023-02"}'.
  # Left empty, an incremental run reprocesses every month.
  month: null
  # Athena table the PySpark job's output is registered as (ingestion/athena_register.py)
  trips_table: trips_cleaned_v2

models:
  nyc_taxi_transform:
    staging:
      +materialized: view
    marts:
      +materialized: table
